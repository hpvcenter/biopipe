apiVersion: batch/v1
kind: Job
metadata:
  name: biopipe-v2
  namespace: YOUR_PROJECT_NAMESPACE
spec:
  completionMode: Indexed
  completions: 1 # Set to the number of samples in the ConfigMap JSON.
  parallelism: 1 # Increase only after sizing reference RAM and scratch.
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: biopipe
          image: YOUR_REGISTRY/biopipe-v2:YOUR_TAG
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /config/config.json
            - --mode
            - local
            - --sample-index
            - "$(JOB_COMPLETION_INDEX)"
          env:
            - name: HOPSWORKS_HOST
              value: YOUR_HOPSWORKS_HOST
            - name: HOPSWORKS_PROJECT
              value: YOUR_PROJECT
            - name: HOPSWORKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: biopipe-hopsworks
                  key: api-key
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: 30Gi
            limits:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: 30Gi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: config
          configMap:
            name: biopipe-v2-config
            items:
              - key: config.json
                path: config.json
        - name: scratch
          emptyDir:
            sizeLimit: 30Gi
